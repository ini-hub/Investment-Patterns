[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-patterns"
version = "0.1.0"
description = "NGX Seasonal Pattern Scanner: finds repeatable calendar-window patterns in stock prices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "plotly>=5.18",
    "reportlab>=4.0",
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",
    "hypothesis>=6.90",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scanner = ["default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "regression: needs the NairaDB dataset snapshot (downloaded on first run)",
]
